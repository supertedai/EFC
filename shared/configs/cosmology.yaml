  Omega_m: 0.315
  Omega_b: 0.0493
  Omega_Lambda: 0.685
  sigma8: 0.811
  n_s: 0.965
  tau: 0.054

local:
  H0: 73.0           # SH0ES 2022

mond:
  a0: 1.2e-10        # m/s^2
  a0_kpc: 3.8e-3     # (km/s)^2 / kpc
