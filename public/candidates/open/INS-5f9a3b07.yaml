claim: 'The 2026-09-17 page mapping listed four statements as orphans because they «do
  not exist on the public pages». Measured against the actual page text, three of the
  four are the opposite: efc.h1.002 (the DESI DR2 collapse, α: −1.00±0.46 → −0.14±0.21)
  stands in the Validation Ledger and Predictions, efc.h1.003 (Variant H, ΔAIC = +4.05)
  has its own section «Known negative result (Variant H)» in Predictions, and
  efc.h4.001 (the background lemma, Lemma 1) stands in Atlas and Predictions;
  efc.h1.001 is carried in simplified form in Atlas. The other direction: efc.sparc.001
  was mapped to atlas, likelihood-ledger and validation-ledger, but
  ∇S = (8.20 ± 2.44) × 10⁻² kpc⁻¹ exists on none of them. The real stale_page remainder
  is Atlas: the primary page for efc.core.status.001, without carrying the DESI DR2
  collapse, the perturbation-channel primary or the Variant H negative.'
