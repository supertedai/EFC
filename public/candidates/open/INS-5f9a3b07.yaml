claim: 'Side-kartleggingen 2026-09-17 kartla fire påstander som orphan fordi de «ikke
  finnes på de offentlige sidene». Målt mot faktisk sidetekst er tre av fire det motsatte:
  efc.h1.002 (DESI DR2-kollapsen, α: −1.00±0.46 → −0.14±0.21) står i Validation Ledger
  og Predictions, efc.h1.003 (Variant H, ΔAIC = +4.05) har egen seksjon «Known negative
  result (Variant H)» i Predictions, og efc.h4.001 (bakgrunnslemmaet, Lemma 1) står
  i Atlas og Predictions; efc.h1.001 bæres i forenklet form i Atlas. Motsatt vei:
  efc.sparc.001 var kartlagt til atlas, likelihood-ledger og validation-ledger, men
  ∇S = (8.20 ± 2.44) × 10⁻² kpc⁻¹ finnes ikke på noen av dem. Den reelle stale_page-resten
  er Atlas: primærside for efc.core.status.001, uten å bære DESI DR2-kollapsen, perturbasjonskanal-primæret
  eller Variant H-nullen.'
