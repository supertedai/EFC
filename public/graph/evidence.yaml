# EFC evidence register — phase 1
#
# One entry per evidence source. source_class must never on its own give a
# statement a higher epistemic status: an internal ledger result supports
# derived_result, not automatically independent_support.
schema_version: "1.0"
evidence:
  - evidence_id: ev.efc.h1.001
    type: derived_result
    title: "Growth-rate analysis: fσ₈ below the ΛCDM curve, DAIC = -2.91"
    locator: {repository: supertedai/EFC, path: evidence/01_hypothesis.md, section: H1}
    source_class: internal_analysis
    status: available
    supports_scope: [efc.h1.001, efc.core.status.001]
    limitations: ["the 2.2σ signal is below the threshold for secure detection; an indication, not a claim."]

  - evidence_id: ev.efc.desidr2.001
    type: derived_result
    title: "DESI DR2 analysis: α collapsed -1.00 ± 0.46 → -0.14 ± 0.21; Variant H DAIC = +4.05"
    locator: {repository: supertedai/EFC, path: evidence/01_hypothesis.md, section: "H1 DESI DR2 update",
              basis: {arxiv: "2503.14738", tittel: "DESI DR2 Results II: Measurements of BAO"}}
    source_class: internal_analysis
    status: available
    supports_scope: [efc.h1.002, efc.h1.003, efc.core.status.001]
    limitations: ["EFC OWN analysis of the DESI DR2 data; the external DESI reference (paper/DOI/table) must be supplied in the locator before the class can be raised back to external_release. The background signal is eliminated; the perturbation sector is the primary channel and requires Stage-IV."]

  - evidence_id: ev.efc.h2.001
    type: derived_result
    title: "Planck 2018 consistency: the mu-Σ degeneracy valley is found, the L0 limit holds"
    locator: {repository: supertedai/EFC, path: evidence/01_hypothesis.md, section: H2}
    source_class: internal_analysis
    status: available
    supports_scope: [efc.h2.001]
    limitations: ["Consistency is not confirmation; the L0 reduction is a model property that must survive CMB validation."]

  - evidence_id: ev.efc.h3.001
    type: derived_result
    title: "B0 Bridge Test: mu > 1 excluded with Δχ² = +495 to +2680"
    locator: {repository: supertedai/EFC, path: evidence/01_hypothesis.md, section: H3}
    source_class: internal_analysis
    status: available
    supports_scope: [efc.h3.001]
    limitations: ["Internal analysis; the sign constraint applies within the assumptions of the model."]

  - evidence_id: ev.efc.h4.001
    type: derived_result
    title: "Lemma 1: DE²(z) ≤ 0, analytically proved and numerically verified"
    locator: {repository: supertedai/EFC, path: evidence/01_hypothesis.md, section: H4}
    source_class: internal_analysis
    status: available
    supports_scope: [efc.h4.001]
    limitations: ["A mathematical lemma — it proves a property of the model, not that the model describes the universe."]

  - evidence_id: ev.efc.h5.001
    type: external_source
    title: "Structural mechanism from the action: mu < 1 AND Σ ≥ 1 (DOI:10.6084/m9.figshare.32037990)"
    locator: {repository: supertedai/EFC, path: evidence/01_hypothesis.md, section: H5, doi: "10.6084/m9.figshare.32037990"}
    source_class: published_artifact
    status: available
    supports_scope: [efc.h5.001, efc.h5.002]
    limitations: ["15 viable solutions out of 135 000 scanned; mu < 1 robust (100 %), Σ > 1 semi-robust (61 %)."]

  - evidence_id: ev.efc.sparc.001
    type: derived_result
    title: "EFC-R-SPARC: ∇S = (8.20 ± 2.44) × 10⁻² kpc⁻¹"
    locator: {repository: supertedai/EFC, path: efc_inference, dataset: SPARC}
    source_class: internal_analysis
    status: available
    supports_scope: [efc.sparc.001]
    limitations: ["One measurement, one methodology; requires independent reproduction before a higher status."]

  # --- external evidence register (2026-11-12, kanban t_87ffe720) -------------
  # One entry per independent source placed in the Atlas external-evidence
  # subgraph (docs/validation-ledger/data/atlas_external_evidence.json).
  # source_class is external_publication for all five: none of them is EFC's
  # own analysis, and none of them tests an EFC prediction.

  - evidence_id: ev.ext.isw.001
    type: external_source
    title: "Hansen et al. 2025/2026: candidate ISW sign reversal in local voids (z<0.03)"
    locator: {repository: external, url: "https://arxiv.org/abs/2506.08832", arxiv: "2506.08832"}
    source_class: external_publication
    status: available
    supports_scope: [efc.ext.001]
    limitations: ["Candidate local detection, author interpretation 'unknown physical process'; the amplitude is an order of magnitude above the predicted RS/ISW terms, and the sample is not binned by the depth coordinate EFC's planned void sign-flip prediction requires. Candidate compatibility only."]

  - evidence_id: ev.ext.tsagas.001
    type: external_source
    title: "Tsagas 2025: GR peculiar-velocity flux raises linear growth to delta proportional to t"
    locator: {repository: external, url: "https://arxiv.org/abs/2511.19736", arxiv: "2511.19736"}
    source_class: external_publication
    status: available
    supports_scope: [efc.ext.001]
    limitations: ["Model-derived theory in an essay, with no data comparison and no error budget. It is a competing mechanism for early massive galaxies, not a measurement and not a refutation of EFC."]

  - evidence_id: ev.ext.cheng.001
    type: external_source
    title: "Cheng et al. 2026: bottom-heavy IMF, conditional ~4 +/- 1 mass factor for possible early progenitors"
    locator: {repository: external, url: "https://www.nature.com/articles/s41550-026-02932-4", doi: "10.1038/s41550-026-02932-4"}
    source_class: external_publication
    status: available
    supports_scope: [efc.ext.001]
    limitations: ["Nine galaxies at z ~ 0.7; the mass factor is conditional ('may', 'implying') and refers to possible progenitors, not to a measured z > 10 mass. It can weaken the anomaly premise, not test EFC."]

  - evidence_id: ev.ext.kids.001
    type: external_source
    title: "KiDS-Legacy 2025: S8 = 0.815 (+0.016/-0.021), 0.73 sigma from Planck"
    locator: {repository: external, url: "https://arxiv.org/abs/2503.19441", arxiv: "2503.19441"}
    source_class: external_publication
    status: available
    supports_scope: [efc.ext.001]
    limitations: ["A shear measurement of S8 with its own pipeline and calibration history; it constrains a parameter, not a mechanism, and the paper attributes its shift in S8 to changes in its own analysis chain."]

  - evidence_id: ev.ext.desy6.001
    type: external_source
    title: "DES Y6 2026: S8 = 0.789 +/- 0.012, 2.6 sigma projected difference from a combined CMB baseline"
    locator: {repository: external, url: "https://arxiv.org/abs/2601.14559", arxiv: "2601.14559"}
    source_class: external_publication
    status: available
    supports_scope: [efc.ext.001]
    limitations: ["The 2.6 sigma figure is a projection of a 1.8-sigma full-space difference onto S8, and the comparison baseline is Planck + ACT-DR6 + SPT-3G, not Planck alone."]

  - evidence_id: ev.ext.fs8contract.001
    type: derived_result
    title: "Sealed fsigma8 contract read back from the prediction bus: pending, arbiter = no"
    locator: {repository: supertedai/EFC, path: docs/validation-ledger/data/atlas_external_evidence.json, section: pending_contracts}
    source_class: internal_analysis
    status: available
    supports_scope: [efc.ext.001]
    limitations: ["A bus readback at one moment (2026-11-12, seq 31058). It establishes that the contract was open then; it cannot establish that it is open later. Re-read before citing."]
