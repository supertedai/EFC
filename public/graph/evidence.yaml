# EFC evidensregister — fase 1
#
# Én post per evidenskilde. source_class må aldri alene gi en påstand
# høyere epistemisk status: et internt ledger-resultat støtter
# derived_result, ikke automatisk independent_support.
schema_version: "1.0"
evidence:
