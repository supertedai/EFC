# EFC evidence register — phase 1
#
# One entry per evidence source. source_class must never on its own give a
# statement a higher epistemic status: an internal ledger result supports
# derived_result, not automatically independent_support.
schema_version: "1.0"
evidence:
  - evidence_id: ev.efc.h1.001
    type: derived_result
    title: "Growth-rate analysis: fσ₈ below the ΛCDM curve, DAIC = -2.91"
    locator: {repository: supertedai/EFC, path: evidence/01_hypothesis.md, section: H1}
    source_class: internal_analysis
    status: available
    supports_scope: [efc.h1.001, efc.core.status.001]
    limitations: ["the 2.2σ signal is below the threshold for secure detection; an indication, not a claim."]

  - evidence_id: ev.efc.desidr2.001
    type: derived_result
    title: "DESI DR2 analysis: α collapsed -1.00 ± 0.46 → -0.14 ± 0.21; Variant H DAIC = +4.05"
    locator: {repository: supertedai/EFC, path: evidence/01_hypothesis.md, section: "H1 DESI DR2 update",
              basis: {arxiv: "2503.14738", tittel: "DESI DR2 Results II: Measurements of BAO"}}
    source_class: internal_analysis
    status: available
    supports_scope: [efc.h1.002, efc.h1.003, efc.core.status.001]
    limitations: ["EFC OWN analysis of the DESI DR2 data; the external DESI reference (paper/DOI/table) must be supplied in the locator before the class can be raised back to external_release. The background signal is eliminated; the perturbation sector is the primary channel and requires Stage-IV."]

  - evidence_id: ev.efc.h2.001
    type: derived_result
    title: "Planck 2018 consistency: the mu-Σ degeneracy valley is found, the L0 limit holds"
    locator: {repository: supertedai/EFC, path: evidence/01_hypothesis.md, section: H2}
    source_class: internal_analysis
    status: available
    supports_scope: [efc.h2.001]
    limitations: ["Consistency is not confirmation; the L0 reduction is a model property that must survive CMB validation."]

  - evidence_id: ev.efc.h3.001
    type: derived_result
    title: "B0 Bridge Test: mu > 1 excluded with Δχ² = +495 to +2680"
    locator: {repository: supertedai/EFC, path: evidence/01_hypothesis.md, section: H3}
    source_class: internal_analysis
    status: available
    supports_scope: [efc.h3.001]
    limitations: ["Internal analysis; the sign constraint applies within the assumptions of the model."]

  - evidence_id: ev.efc.h4.001
    type: derived_result
    title: "Lemma 1: DE²(z) ≤ 0, analytically proved and numerically verified"
    locator: {repository: supertedai/EFC, path: evidence/01_hypothesis.md, section: H4}
    source_class: internal_analysis
    status: available
    supports_scope: [efc.h4.001]
    limitations: ["A mathematical lemma — it proves a property of the model, not that the model describes the universe."]

  - evidence_id: ev.efc.h5.001
    type: external_source
    title: "Structural mechanism from the action: mu < 1 AND Σ ≥ 1 (DOI:10.6084/m9.figshare.32037990)"
    locator: {repository: supertedai/EFC, path: evidence/01_hypothesis.md, section: H5, doi: "10.6084/m9.figshare.32037990"}
    source_class: published_artifact
    status: available
    supports_scope: [efc.h5.001, efc.h5.002]
    limitations: ["15 viable solutions out of 135 000 scanned; mu < 1 robust (100 %), Σ > 1 semi-robust (61 %)."]

  - evidence_id: ev.efc.sparc.001
    type: derived_result
    title: "EFC-R-SPARC: ∇S = (8.20 ± 2.44) × 10⁻² kpc⁻¹"
    locator: {repository: supertedai/EFC, path: efc_inference, dataset: SPARC}
    source_class: internal_analysis
    status: available
    supports_scope: [efc.sparc.001]
    limitations: ["One measurement, one methodology; requires independent reproduction before a higher status."]
