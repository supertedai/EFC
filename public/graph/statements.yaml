schema_version: '1.0'
statements:
- statement_id: efc.core.status.001
  text: 'EFC is compatible with late-time growth-rate data at the ~2σ level in the
    perturbation sector, and is a candidate extension of ΛCDM pending CMB validation.
    The background sector shows no significant evidence of a signal (DESI DR2: 2.2σ
    → 0.68σ, see efc.h1.002); the status applies to the μ/Σ/η channel only.'
  kind: status
  epistemic_level: partial_support
  owner_role: researcher
  status: active
  supported_by:
  - ev.efc.h1.001
  - ev.efc.desidr2.001
  contradicts: []
  supersedes: null
  appears_on:
  - page_id: atlas
    role: primary
- statement_id: efc.h1.001
  text: 'Late-time cosmic entropy gradients modify the effective gravitational coupling:
    mu(a) < 1 at z < z_t suppresses structural growth (σ₈) without changing early-universe
    physics.'
  kind: hypothesis
  epistemic_level: partial_support
  owner_role: researcher
  status: active
  supported_by:
  - ev.efc.h1.001
  contradicts: []
  supersedes: null
  falsifier:
    type: explicit
    description: fσ₈(z) systematically ABOVE the ΛCDM curve at z < 1 would falsify
      the mu < 1 channel.
  appears_on: []
- statement_id: efc.h1.002
  text: 'DESI DR2: the background sector coupling parameter α collapsed from -1.00
    ± 0.46 (2.2σ) to -0.14 ± 0.21 (0.68σ) — the background signal is gone, and the
    perturbation sector (mu, Σ, η) is now the primary channel.'
  kind: derived_result
  epistemic_level: partial_support
  owner_role: researcher
  status: active
  supported_by:
  - ev.efc.desidr2.001
  contradicts: []
  supersedes: null
  appears_on: []
- statement_id: efc.h1.003
  text: 'Variant H (the entropy-gradient growth mechanism) shows no data preference:
    DAIC = +4.05, S₀ = 0.21 ± 0.14 at 1.5σ — the signal may lie below current
    sensitivity.'
  kind: negative_result
  epistemic_level: partial_support
  owner_role: researcher
  status: active
  supported_by:
  - ev.efc.desidr2.001
  contradicts: []
  supersedes: null
  appears_on: []
- statement_id: efc.h2.001
  text: 'EFC effects are regime-specific: L0 (CMB/linear) reduces to ΛCDM exactly,
    L1 (BAO/quasi-linear) has a small perturbative modification, L2 (galaxy/non-linear)
    has an active entropy-structure coupling, and L3 (cluster/strong field) shows full
    EFC dynamics.'
  kind: model_definition
  epistemic_level: documented
  owner_role: researcher
  status: active
  supported_by:
  - ev.efc.h2.001
  contradicts: []
  supersedes: null
  falsifier:
    type: explicit
    description: Any deviation from ΛCDM at CMB scales (L0) falsifies the framework.
  appears_on:
  - page_id: atlas
    role: primary
  - page_id: white-paper-series
    role: cited
- statement_id: efc.h3.001
  text: 'mu < 1 at late times is required: mu > 1 (strengthened gravity) is excluded
    by the fσ₈ data with Δχ² = +495 to +2680 (B0 Bridge Test).'
  kind: derived_result
  epistemic_level: partial_support
  owner_role: researcher
  status: active
  supported_by:
  - ev.efc.h3.001
  contradicts: []
  supersedes: null
  appears_on:
  - page_id: atlas
    role: primary
- statement_id: efc.h4.001
  text: 'Background lemma: DE²(z) ≤ 0 for all z > 0, so that H_EFC(z) ≤ H_ΛCDM(z) —
    reduced Hubble friction, improved growth. Analytically proved (Lemma 1) and
    numerically verified.'
  kind: derived_result
  epistemic_level: partial_support
  owner_role: researcher
  status: active
  supported_by:
  - ev.efc.h4.001
  contradicts: []
  supersedes: null
  appears_on: []
- statement_id: efc.h5.001
  text: 'The EFC Lagrange-multiplier flow condition yields anisotropic stress without
    a standard Horndeski correspondence: mu < 1 AND Σ ≥ 1 at the same time — a regime
    that standard quasi-static Horndeski with α_T = 0 provably cannot produce
    (Σ ≤ mu universally there).'
  kind: derived_result
  epistemic_level: documented
  owner_role: researcher
  status: active
  supported_by:
  - ev.efc.h5.001
  contradicts: []
  supersedes: null
  appears_on:
  - page_id: atlas
    role: primary
  - page_id: predictions
    role: cited
  - page_id: model-comparison
    role: cited
  - page_id: validation-ledger
    role: cited
- statement_id: efc.h5.002
  text: 'Prediction: a redshift-dependent lensing crossover at z ~ 0.44 with a
    percent-level amplitude — Σ_eff > 1 at z < 0.4, Σ_eff < 1 at z > 0.5. This
    non-monotonic tomographic signature does not exist in ΛCDM.'
  kind: prediction
  epistemic_level: pending_external_validation
  owner_role: researcher
  status: active
  supported_by:
  - ev.efc.h5.001
  contradicts: []
  supersedes: null
  falsifier:
    type: explicit
    description: Tomographic measurements without a crossing, or with a monotonic
      Σ_eff, weaken the prediction.
  appears_on:
  - page_id: predictions
    role: primary
  - page_id: atlas
    role: cited
- statement_id: efc.sparc.001
  text: ∇S = (8.20 ± 2.44) × 10⁻² kpc⁻¹ (EFC-R-SPARC) — the entropy gradient measured
    from galaxy rotation curves.
  kind: derived_result
  epistemic_level: partial_support
  owner_role: researcher
  status: active
  supported_by:
  - ev.efc.sparc.001
  contradicts: []
  supersedes: null
  appears_on:
  - page_id: atlas
    role: cited
  - page_id: likelihood-ledger
    role: cited
  - page_id: validation-ledger
    role: cited
