# EFC Bridge — reduced K0/m^2 run
# ================================
#
# Sandbox-runnable companion to efc_bridge_K0m2.yaml. Uses vanilla CAMB
# (no MGCAMB needed) and the data that the in-sandbox network can reach:
#
#     Planck 2018 lowl TT + EE
#     Planck 2018 lensing.native
#     DESI 2024 BAO (full sample)
#     Pantheon+ supernovae
#
# Sampled (8): logA, ns, theta_MC_100, ombh2, omch2, tau, K0, m_sq
#
# The bridge from (K0, m^2) -> Sigma0 is the same closed-form mapping as
# in bridge_theory.py, and Alens = Sigma0^2 is plugged into vanilla CAMB
# to drive the lensing amplitude. mu0 is not honoured by vanilla CAMB,
# so this run constrains (K0, m^2) only through the Sigma channel; the
# growth (mu) channel is reserved for the full plik_lite + MGCAMB run.
#
# This is the in-sandbox version of "the run that decides".

theory:
  camb:
    extra_args:
      lmax: 2700
      lens_potential_accuracy: 4
      AccuracyBoost: 1.2
      lAccuracyBoost: 1.2
      dark_energy_model: fluid
      w: -1.0
      num_massive_neutrinos: 1
      mnu: 0.06
      nnu: 3.044

likelihood:
  planck_2018_lowl.TT:
  planck_2018_lowl.EE:
  planck_2018_lensing.native:
  bao.desi_2024_bao_all:
  sn.pantheonplus:

params:
  # -------------------- standard cosmology --------------------
  logA:
    prior: {min: 2.6, max: 3.5}
    ref: {dist: norm, loc: 3.044, scale: 0.02}
    proposal: 0.015
    latex: \log(10^{10} A_\mathrm{s})
    drop: true
  As:
    value: "lambda logA: 1e-10*np.exp(logA)"
    latex: A_\mathrm{s}
  ns:
    prior: {min: 0.9, max: 1.05}
    ref: {dist: norm, loc: 0.9649, scale: 0.005}
    proposal: 0.004
    latex: n_\mathrm{s}
  theta_MC_100:
    prior: {min: 1.03, max: 1.05}
    ref: {dist: norm, loc: 1.04109, scale: 0.0005}
    proposal: 0.0004
    latex: 100\theta_\mathrm{MC}
    drop: true
    renames: theta
  cosmomc_theta:
    value: "lambda theta_MC_100: 1.e-2*theta_MC_100"
    derived: false
  H0:
    latex: H_0
  ombh2:
    prior: {min: 0.019, max: 0.025}
    ref: {dist: norm, loc: 0.02237, scale: 0.0002}
    proposal: 0.0001
    latex: \Omega_\mathrm{b} h^2
  omch2:
    prior: {min: 0.095, max: 0.145}
    ref: {dist: norm, loc: 0.1200, scale: 0.002}
    proposal: 0.0015
    latex: \Omega_\mathrm{c} h^2
  tau:
    prior: {dist: norm, loc: 0.0544, scale: 0.0073}
    ref:   {dist: norm, loc: 0.0544, scale: 0.006}
    proposal: 0.005
    latex: \tau_\mathrm{reio}

  # -------------------- EFC field parameters --------------------
  K0:
    prior: {min: 0.5, max: 3.0}
    ref:   {dist: norm, loc: 1.66, scale: 0.05}
    proposal: 0.04
    latex: K_0
    drop: true
  m_sq:
    prior: {min: 0.001, max: 0.010}
    ref:   {dist: norm, loc: 0.0035, scale: 0.0003}
    proposal: 0.0002
    latex: m^2
    drop: true

  # -------------------- bridge: (K0, m^2) -> (mu0, sigma0, Alens) --------------------
  # mu0 and Sigma0_eff are diagnostics only -- vanilla CAMB does not
  # honour them, and they would error out if passed as computed inputs.
  mu0:
    derived: "lambda K0: 1.0 / (1.0 + K0 * 2.401e-7 / 0.05**4)"
    latex: \mu_0
  Sigma0_eff:
    derived: "lambda K0, m_sq: 0.5 * (1.0 + 1.0 + (1.23 - 1.0) / 0.156627 * (1.0 - m_sq / (K0 * 0.05**2))) * (1.0 / (1.0 + K0 * 2.401e-7 / 0.05**4))"
    latex: \Sigma_0
  # Alens IS honoured by vanilla CAMB. Computed directly from (K0, m^2)
  # via the same expression as Sigma0_eff, squared.
  Alens:
    value: "lambda K0, m_sq: (0.5 * (1.0 + 1.0 + (1.23 - 1.0) / 0.156627 * (1.0 - m_sq / (K0 * 0.05**2))) * (1.0 / (1.0 + K0 * 2.401e-7 / 0.05**4)))**2"
    latex: A_\mathrm{L}

  # -------------------- derived diagnostics --------------------
  sigma8:
    latex: \sigma_8
  S8:
    derived: "lambda sigma8, omegam: sigma8*(omegam/0.3)**0.5"
    latex: S_8
  omegam:
    latex: \Omega_\mathrm{m}
  age:
    latex: "{\\rm{Age}}/\\mathrm{Gyr}"
  rdrag:
    latex: r_\mathrm{drag}

sampler:
  minimize:
    method: bobyqa
    override_bobyqa:
      rhoend: 0.001
      maxfun: 5000

output: chains/efc_bridge_K0m2_reduced
