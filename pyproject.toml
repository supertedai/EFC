[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "efc"
version = "3.1.0"
description = "Energy-Flow Cosmology — unified thermodynamic framework"
readme = "README.md"
license = "CC-BY-4.0"
requires-python = ">=3.9"
authors = [
    { name = "Morten Magnusson" },
]

dependencies = [
    "numpy>=1.22,<3",
    "scipy>=1.8,<2",
    "matplotlib>=3.5,<4",
    "pandas>=1.4,<3",
]

[project.optional-dependencies]
hcp = ["nibabel>=4.0,<6"]
cosmosis = ["cosmosis>=0.5"]
# Merk:  kreves av efc_inference/runs/research_daemon.py, som
# efc_inference/tests/test_research_daemon_publish.py importerer. Uten den
# kan ikke den testen samles fra repo-roten.
verify = ["jsonschema>=4.18,<5", "rfc3339-validator>=0.1,<1", "pytest>=8,<9", "PyYAML>=6,<7", "emcee>=3,<4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# Skillet mellom hovedsuiten og forskningskoden. Uten det samler `pytest`
# fra repo-roten ogsaa forskningskoden under `docs/papers/` — ekte tester for
# sine papirer, men med egne avhengigheter (emcee, efc.perturbation, run_pilot)
# som ikke er installert her.
#
# Maalt 2026-09-17: `pytest` fra roten ga 10 collection-feil, alle i
# docs/papers/efc/. Fem reviewere brukte tid paa aa gjette riktig kommando.
#
# VIKTIG — `norecursedirs` OVERSKRIVER Pytests standarder. Den maa derfor
# liste dem opp igjen, ellers samles skjulte kataloger og byggemapper.
# Standardene (pytest 8): *.egg .* _darcs build CVS dist node_modules venv {arch}
# Maalt: uten `.*` ble en midlertidig `tests/.probe/` samlet.
#
# MERK: `efc_inference/tests/` (123 tester) hoerer i hovedsuiten og skal IKKE
# utelates. `testpaths` alene ville fjernet dem — det ble maalt og rettet.
#
# Forskningskoden kjoeres fra sin egen katalog:
#     pytest docs/papers/efc/<papir>/
norecursedirs = [
    "docs",
    "pipelines",
    "*.egg",
    ".*",
    "_darcs",
    "build",
    "CVS",
    "dist",
    "node_modules",
    "venv",
    "{arch}",
]
# `src/` maa staa paa sys.path FOER samlingen, ellers avhenger det av
# rekkefoelgen om en testfil kan importeres i det hele tatt.
#
# Maalt 2026-09-18: `pytest tests/test_growth_friction.py` alene feilet med
# `ModuleNotFoundError: No module named 'efc'`, mens hele suiten var groenn —
# fordi `tests/test_cosmology_engine_bridges.py` (som samles foerst, siden
# «c» < «g») importerer `efc_inference.engine.rotation`, og DEN modulen
# setter `src/` inn i sys.path som bivirkning av importen. Snu rekkefoelgen,
# og samlingen stopper med én collection-feil. CI har ikke sett det, fordi
# `uv sync` installerer pakken der; en bar testvenv har den ikke.
#
# Samme klasse som t_122b4022: utfallet skal komme fra testen, ikke fra hva
# som tilfeldigvis ble samlet foer den.
pythonpath = ["src"]
