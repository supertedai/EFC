[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "efc"
version = "3.1.0"
description = "Energy-Flow Cosmology — unified thermodynamic framework"
readme = "README.md"
license = "CC-BY-4.0"
requires-python = ">=3.9"
authors = [
    { name = "Morten Magnusson" },
]

dependencies = [
    "numpy>=1.22,<3",
    "scipy>=1.8,<2",
    "matplotlib>=3.5,<4",
    "pandas>=1.4,<3",
]

[project.optional-dependencies]
hcp = ["nibabel>=4.0,<6"]
cosmosis = ["cosmosis>=0.5"]
verify = ["jsonschema>=4.18,<5", "rfc3339-validator>=0.1,<1", "pytest>=8,<9", "PyYAML>=6,<7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# Hovedsuiten er `tests/`. Uten denne linjen samler `pytest` fra repo-roten
# ogsaa forskningskoden under `docs/papers/` og `pipelines/` — de er ekte
# tester for sine respektive papirer, men har egne avhengigheter (emcee,
# efc.perturbation, run_pilot) som ikke er installert her.
#
# Maalt 2026-09-17: `pytest` fra roten ga 10 collection-feil, alle i
# docs/papers/efc/. `pytest tests/` samler 539 tester uten feil. Fire
# reviewere brukte tid paa aa gjette riktig kommando fordi skillet ikke
# stod noe sted — dette er skillet, skrevet ned der det blir lest.
#
# Forskningskoden kjoeres fra sin egen katalog:
#     pytest docs/papers/efc/<papir>/
testpaths = ["tests"]
norecursedirs = ["docs", "pipelines", ".worktrees", ".git", "node_modules"]
