# EFC hi_class configuration
# Generated by efc_hiclass_bridge.py
# EFC parameters: B0=1.0, M0=1.0, a_t=0.3, Delta=0.3
#
# NOTE: propto_omega gives alpha_i(a) = c_i * Omega_DE(a) which does NOT
# match the EFC logistic profile S(a). The time-dependence is too gradual
# compared to EFC's sharp transition at z_t=2.3. This produces large ISW
# artefacts at low ell. For production runs, a custom gravity_model reading
# the alpha table (data/efc_hiclass_alphas.dat) is required.

# --- Background cosmology (LCDM, Planck 2018) ---
h = 0.6736
omega_b = 0.02237
omega_cdm = 0.12
n_s = 0.9649
ln10^{10}A_s = 3.044
tau_reio = 0.0544

# --- DE sector (computed by hi_class) ---
Omega_Lambda = 0
Omega_fld = 0
Omega_smg = -1

# --- Modified gravity (Horndeski via hi_class) ---
gravity_model = propto_omega
expansion_model = lcdm
expansion_smg = 0.6862

# propto_omega: 5 params = c_K, c_B, c_M, c_T, M*2_init
# alpha_i(a) = c_i * Omega_DE(a)
# EFC mapping (approximate): c_M = alpha_M(z=0)/Omega_DE(z=0) = 0.982/0.686 = 1.432
#                             c_B = alpha_B(z=0)/Omega_DE(z=0) = 0.058/0.686 = 0.085
parameters_smg = 1.5, 0.085, 1.432, 0.0, 1.0

# --- Output ---
root = output/efc_
output = tCl, pCl, lCl, mPk
lensing = yes
l_max_scalars = 5000

# --- Precision ---
non_linear = hmcode

# --- Transfer functions for fsigma8 ---
z_pk = 0.0, 0.2, 0.35, 0.5, 0.7, 1.0, 1.5, 2.0
