# EFC hi_class configuration
# Requires: hi_class patched with efc_logistic gravity model
# Apply patch: cd hi_class_public && git apply /path/to/hi_class_efc_logistic.patch
#
# Custom gravity_model "efc_logistic" implements the EFC logistic entropy
# field S(a) = 1/(1+exp(-(ln a - ln a_t)/Delta)) directly in hi_class.
# delta_M2 is computed analytically (no ODE stiffness issues).
#
# STABILITY NOTE: B0 > 0 (braiding) causes c_s^2 < 0 gradient instability.
# Use B0=0 (alpha_M only) until braiding stability is resolved.
# This is a known constraint in Horndeski parameter space, not an EFC bug.

# --- Background cosmology (LCDM, Planck 2018) ---
h = 0.6736
omega_b = 0.02237
omega_cdm = 0.12
n_s = 0.9649
ln10^{10}A_s = 3.044
tau_reio = 0.0544

# --- DE sector (computed by hi_class) ---
Omega_Lambda = 0
Omega_fld = 0
Omega_smg = -1

# --- Modified gravity: EFC logistic ---
gravity_model = efc_logistic
expansion_model = lcdm
expansion_smg = 0.6862

# efc_logistic: 6 params = B0, M0, a_t, Delta, alpha_K, alpha_T
# alpha_B(a) = B0 * dS/dlna,  alpha_M(a) = M0 * S(a),  alpha_T = const
# S(a) = 1/(1+exp(-(ln a - ln a_t)/Delta))
parameters_smg = 0.0, 1.0, 0.3, 0.3, 1.0, 0.0

# --- Output ---
root = output/efc_
output = tCl, pCl, lCl, mPk
lensing = yes
l_max_scalars = 5000

# --- Precision ---
non_linear = hmcode

# --- Transfer functions for fsigma8 ---
z_pk = 0.0, 0.2, 0.35, 0.5, 0.7, 1.0, 1.5, 2.0
