# ΛCDM Reference — PolyChord via Cobaya
# ========================================
#
# Identical to efc_polychord.yaml but WITHOUT K0 and m_sq.
# Produces ln(Z_ΛCDM) for Bayes factor computation:
#     ln(B) = ln(Z_EFC) - ln(Z_ΛCDM)
#
# CRITICAL: same likelihoods, same ΛCDM priors, same theory settings.
# Only difference: 6 sampled parameters instead of 8.
#
# Run:
#   mpirun -n 32 cobaya-run config/lcdm_polychord.yaml
#
# Author: Morten Magnusson / Symbiose Research
# Date:   2026-04-12

theory:
  camb:
    extra_args:
      # Standard CAMB (no MG flags) — ΛCDM background + perturbations
      lmax: 2700
      lens_potential_accuracy: 4
      AccuracyBoost: 1.2
      lAccuracyBoost: 1.2
      dark_energy_model: fluid
      w: -1.0
      num_massive_neutrinos: 1
      mnu: 0.06
      nnu: 3.044

likelihood:
  planck_2018_highl_plik.TTTEEE_lite:
  planck_2018_lowl.TT:
  planck_2018_lowl.EE:
  planck_2018_lensing.clik:
  bao.desi_2024_bao_all:
  sn.pantheonplus:

params:
  # -------------------- standard cosmology (same priors as EFC) --------------------
  logA:
    prior: {min: 2.6, max: 3.5}
    ref: {dist: norm, loc: 3.044, scale: 0.02}
    proposal: 0.015
    latex: \log(10^{10} A_\mathrm{s})
    drop: true
  As:
    value: "lambda logA: 1e-10*np.exp(logA)"
    latex: A_\mathrm{s}
  ns:
    prior: {min: 0.9, max: 1.05}
    ref: {dist: norm, loc: 0.9649, scale: 0.005}
    proposal: 0.004
    latex: n_\mathrm{s}
  theta_MC_100:
    prior: {min: 1.03, max: 1.05}
    ref: {dist: norm, loc: 1.04109, scale: 0.0005}
    proposal: 0.0004
    latex: 100\theta_\mathrm{MC}
    drop: true
    renames: theta
  cosmomc_theta:
    value: "lambda theta_MC_100: 1.e-2*theta_MC_100"
    derived: false
  H0:
    latex: H_0
  ombh2:
    prior: {min: 0.019, max: 0.025}
    ref: {dist: norm, loc: 0.02237, scale: 0.0002}
    proposal: 0.0001
    latex: \Omega_\mathrm{b} h^2
  omch2:
    prior: {min: 0.095, max: 0.145}
    ref: {dist: norm, loc: 0.1200, scale: 0.002}
    proposal: 0.0015
    latex: \Omega_\mathrm{c} h^2
  tau:
    prior: {dist: norm, loc: 0.0544, scale: 0.0073}
    ref:   {dist: norm, loc: 0.0544, scale: 0.006}
    proposal: 0.005
    latex: \tau_\mathrm{reio}

  # No K0, m_sq — this IS the ΛCDM limit

  # -------------------- derived diagnostics --------------------
  sigma8:
    latex: \sigma_8
  S8:
    derived: "lambda sigma8, omegam: sigma8*(omegam/0.3)**0.5"
    latex: S_8
  omegam:
    latex: \Omega_\mathrm{m}
  age:
    latex: "{\\rm{Age}}/\\mathrm{Gyr}"
  rdrag:
    latex: r_\mathrm{drag}

sampler:
  polychord:
    path: null
    nlive: 500
    num_repeats: 45          # 7.5 × 6 = 45 (6 params instead of 8)
    precision_criterion: 0.01
    max_ndead: -1
    boost_posterior: 10
    feedback: 1
    do_clustering: true
    read_resume: true
    base_dir: polychord_output
    file_root: lcdm_nested

output: chains/lcdm_polychord
