name: EFC DOI coverage

# Measures DOI coverage of docs/public against the ORCID canon, in this
# repository's own CI.
#
# Replaces the external job that ran on a workstation outside the repo and
# committed to main every six hours. Measured 2026-08-23: 64 of the last 80
# commits on main were that job, and every one of them changed only the
# timestamp — the numbers stood still. See supertedai/Hetzner ADR-024 §6.
#
# The generator writes no timestamp into the report, so identical content
# produces an identical file and no commit. A commit here therefore means a
# number actually moved.

on:
  push:
    branches: [main]
    paths:
      - "docs/public/**"
      - "figshare/doi-map.json"
      - "docs/validation-ledger/data/external-references.json"
      - "scripts/maintenance/efc_doi_coverage.py"
      - ".github/workflows/efc-doi-coverage.yml"
  schedule:
    # Once a day. ORCID can change without this repo changing; four times a
    # day bought nothing but noise.
    - cron: "20 5 * * *"
  workflow_dispatch:

concurrency:
  group: efc-doi-coverage
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Measure DOI coverage
        run: python3 scripts/maintenance/efc_doi_coverage.py

      - name: Commit only if a number moved
        run: |
          if git diff --quiet -- docs/public/DOI_Coverage_Report.md; then
            echo "No change — nothing to commit. This is the normal outcome."
            exit 0
          fi
          git config user.name  "efc-doi-coverage[bot]"
          git config user.email "efc-doi-coverage@users.noreply.github.com"
          git add docs/public/DOI_Coverage_Report.md
          git commit -m "chore(doi-coverage): coverage numbers changed" \
                     -m "Generated by scripts/maintenance/efc_doi_coverage.py in CI. The report carries no timestamp, so this commit means a number actually moved — not that the clock did."
          git push

      - name: Job summary
        if: always()
        run: |
          {
            echo "### DOI coverage"
            echo ""
            head -6 docs/public/DOI_Coverage_Report.md
          } >> "$GITHUB_STEP_SUMMARY"
