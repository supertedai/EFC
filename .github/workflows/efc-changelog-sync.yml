name: EFC changelog sync

# P0 t_26dd0ef5: the changelog is a deterministic projection of git history.
# This gate makes it DE FACTO required: any PR that changes public HTML (or
# other repo areas) MUST carry the regenerated changelog, or CI goes red.
# Language rule (Morten 2026-09-17): all EFC repo content is English — new
# changelog entries are checked for Norwegian stopwords and rejected.

on:
  push:
    branches: [main]
    paths:
      - 'docs/public/**'
      - 'docs/papers/**'
      - 'docs/validation-ledger/**'
      - 'public/**'
      - '.github/workflows/efc-changelog-sync.yml'
      - 'scripts/maintenance/changelog_projeksjon.py'
  pull_request:
    paths:
      - 'docs/public/**'
      - 'docs/papers/**'
      - 'docs/validation-ledger/**'
      - 'public/**'
      # The writers and the helper they share: a change here decides whether
      # the projection stays the single owner of the two generated files.
      - 'scripts/maintenance/changelog_projeksjon.py'
      - 'scripts/maintenance/efc_auto_changelog.py'
      - 'scripts/maintenance/efc_maintain.py'
      - 'scripts/maintenance/efc_navbar_sync.py'
      - 'scripts/maintenance/_nav_helper.py'
      - 'tests/test_maintenance_chain_fixpoint.py'
      - '.github/workflows/efc-changelog-sync.yml'

jobs:
  changelog-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fixpoint tests (the start point resolves; the chain converges)
        run: |
          python3 -m pip install --quiet "pytest>=8,<9"
          python3 -m pytest tests/test_changelog_projeksjon.py \
                           tests/test_maintenance_chain_fixpoint.py \
                           tests/test_nav_helper_canonical.py -q
      - name: Regenerate changelog (projection)
        run: python3 scripts/maintenance/changelog_projeksjon.py
      - name: Require sync (red if the changelog diverges)
        run: |
          if ! git diff --quiet -- docs/public/EFC_Changelog.html docs/validation-ledger/data/changelog.json; then
            echo "::error::Changelog out of sync. Run: python3 scripts/maintenance/changelog_projeksjon.py and commit the result in the same PR."
            git diff --stat -- docs/public/EFC_Changelog.html docs/validation-ledger/data/changelog.json
            exit 1
          fi
          echo "✓ Changelog in sync (projection matches history)"
      - name: Step 8 of efc_maintain must not break the fixpoint
        # The projection above is only half the property: the maintenance
        # chain also writes, and it must not write THESE two files. Measured
        # 2026-09-18 (t_9cdf466e): efc_auto_changelog.py (step 8) rewrote
        # changelog.json with json.dump's default ensure_ascii=True, so every
        # em dash became an escape; the projection rewrote it back and the
        # gate was red on a tree that was in fixpoint. A dirty, public-
        # relevant tree is created on purpose, because an automatic step that
        # only writes when there is something to write must be given
        # something to write about.
        run: |
          printf '\n<!-- fixpoint probe -->\n' >> docs/public/EFC_Atlas.html
          python3 scripts/maintenance/efc_auto_changelog.py
          git checkout -- docs/public/EFC_Atlas.html
          if ! git diff --quiet -- docs/public/EFC_Changelog.html docs/validation-ledger/data/changelog.json; then
            echo "::error::efc_auto_changelog.py wrote a file the projection owns. The projection is the single writer; this step must only report."
            git diff --stat -- docs/public/EFC_Changelog.html docs/validation-ledger/data/changelog.json
            exit 1
          fi
          echo "✓ Step 8 reports and writes neither generated file"
      - name: Language gate (English only in changelog)
        run: |
          python3 - << 'PYEOF'
          import json, re, sys
          cl = json.load(open('docs/validation-ledger/data/changelog.json'))
          no = re.compile(r'\b(skal|ikke|v[æe]re|v[æe]rt|ble|har|som|med|og|forutsier|konsistent|prediksjonen|målt|stor|negativ|også|etter|men|mot|fra|til|endret|oppdatert|påkrevd|rettet|æ|ø|å)\b', re.I)
          bad = [e.get('summary','') for e in cl.get('changes', [])[:30] if len(no.findall(e.get('summary',''))) >= 1]
          if bad:
              print('::error::Norwegian content in changelog entries — ALL EFC repo content must be English:')
              for b in bad: print('  -', b)
              sys.exit(1)
          print('✓ Changelog language: English only')
          PYEOF
