name: EFC Atlas auto-sync

# Keep EFC_Atlas.html in lockstep with atlas.json + ledger.json on every
# push to any development branch. If the rebuild produced drift, auto-commit
# the corrected HTML back to the same branch.
#
# Only runs on branches, not on main — main is protected and its contents
# are only changed via merged PRs. A nightly cron catches drift from
# ledger edits that went through without triggering the atlas paths.
#
# Source of truth hierarchy:
#   Symbiose graph  -> atlas.json             (regenerated via Claude/MCP)
#   Symbiose graph  -> ledger.json            (regenerated via Symbiose pipeline)
#   atlas.json + ledger.json + build_atlas.py -> EFC_Atlas.html   (this workflow)

on:
  push:
    branches-ignore:
      - main
    paths:
      - "docs/validation-ledger/data/atlas.json"
      - "docs/validation-ledger/data/ledger.json"
      - "scripts/build_atlas.py"
      - ".github/workflows/atlas-sync.yml"
  workflow_dispatch:
  schedule:
    # Nightly at 05:45 UTC — catches drift from direct web edits.
    # Offset from efc-sync (05:30) so they don't collide.
    - cron: "45 5 * * *"

concurrency:
  group: atlas-sync-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    if: github.event.pull_request.head.repo.full_name == github.repository || github.event_name != 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Record baseline commit
        id: baseline
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Rebuild Atlas HTML
        id: build
        run: |
          set -o pipefail
          python3 scripts/build_atlas.py 2>&1 | tee atlas-build.log
          echo "rc=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
        continue-on-error: true

      - name: Detect drift corrections
        id: diff
        run: |
          if git diff --quiet docs/public/EFC_Atlas.html; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No drift — EFC_Atlas.html is already consistent."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Drift detected in EFC_Atlas.html — will auto-commit."
            git --no-pager diff --stat docs/public/EFC_Atlas.html
          fi

      - name: Commit & push drift corrections
        if: steps.diff.outputs.changed == 'true' && github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "atlas-sync[bot]"
          git config user.email "atlas-sync[bot]@users.noreply.github.com"
          git add docs/public/EFC_Atlas.html

          {
            echo "chore(atlas-sync): rebuild EFC_Atlas.html from atlas.json + ledger.json"
            echo
            echo "Generated by scripts/build_atlas.py running under"
            echo ".github/workflows/atlas-sync.yml on commit ${{ steps.baseline.outputs.sha }}."
            echo
            echo "Inputs:"
            echo "  - docs/validation-ledger/data/atlas.json"
            echo "  - docs/validation-ledger/data/ledger.json"
            echo
            echo "Build log:"
            tail -10 atlas-build.log | sed 's/^/  /'
          } > /tmp/atlas_commit_msg

          git commit -F /tmp/atlas_commit_msg

          for delay in 2 4 8 16; do
            if git push origin HEAD:"${GITHUB_REF_NAME:-${{ github.ref_name }}}"; then
              echo "Push succeeded."
              break
            fi
            echo "Push failed; pulling --rebase and retrying in ${delay}s"
            git pull --rebase origin "${GITHUB_REF_NAME:-${{ github.ref_name }}}" || true
            sleep "$delay"
          done

      - name: Job summary
        if: always()
        run: |
          {
            echo "## EFC Atlas auto-sync summary"
            echo
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Branch | \`${GITHUB_REF_NAME:-${{ github.ref_name }}}\` |"
            echo "| Baseline commit | \`${{ steps.baseline.outputs.sha }}\` |"
            echo "| Build rc | \`${{ steps.build.outputs.rc }}\` |"
            echo "| Drift corrections | \`${{ steps.diff.outputs.changed }}\` |"
            echo
            if [ -f atlas-build.log ]; then
              echo "### Build log"
              echo '```'
              cat atlas-build.log
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: atlas-build-log-${{ github.run_id }}
          path: atlas-build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Fail if build did not converge
        if: steps.build.outputs.rc != '0'
        run: |
          echo "::error::scripts/build_atlas.py returned non-zero — see job summary and logs"
          exit 1
