name: EFC backfill PDFs for existing paper directories

# Manual-dispatch workflow that downloads the primary attachment from
# figshare for every paper directory whose has_pdf flag is False in
# figshare/doi-map.json. Complements efc-figshare-presence.yml's
# auto-scaffold pass: scaffold creates *new* directories, this fills
# in PDFs for *existing* ones that were committed without their primary
# attachment (the §3.2 / B11 case in the maintenance constitution).
#
# Closes the manual half of issue #280.
#
# Local equivalent:
#     python3 scripts/maintenance/efc_figshare_check.py --backfill-pdfs

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Refresh doi-map (so has_pdf reflects real filesystem)
        run: python3 scripts/maintenance/generate_doi_map.py

      - name: Backfill PDFs from figshare
        id: backfill
        run: python3 scripts/maintenance/efc_figshare_check.py --backfill-pdfs

      - name: Detect changes
        id: diff
        run: |
          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No PDFs downloaded — every paper already has its primary attachment."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git --no-pager diff --stat | head -40
            git ls-files --others --exclude-standard | head -40
          fi

      - name: Commit + push branch
        if: steps.diff.outputs.changed == 'true'
        id: push
        run: |
          set -e
          BRANCH="auto/backfill-pdfs-$(date -u +%Y%m%d-%H%M%S)"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          git config user.name "efc-sync[bot]"
          git config user.email "efc-sync[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add -A

          NEW_PDFS=$(git diff --cached --name-only \
                    | grep -E '\.(pdf|docx)$' | wc -l)
          echo "count=$NEW_PDFS" >> "$GITHUB_OUTPUT"

          {
            echo "Auto-generated by .github/workflows/efc-backfill-pdfs.yml"
            echo "from figshare/doi-map.json papers with has_pdf:false."
            echo
            echo "## Files added"
            echo
            git diff --cached --name-only \
              | grep -E '\.(pdf|docx)$' \
              | awk '{print "  - " $1}' \
              | sort
            echo
            echo "## Action items for reviewer"
            echo
            echo "  1. Sanity-check each downloaded file (open it, verify it"
            echo "     matches the title in the parent directory's index.json)."
            echo "  2. Run efc_maintain.py locally and confirm no drift."
            echo "  3. Merge."
          } > /tmp/pr_body.md

          git commit -m "auto: backfill $NEW_PDFS missing primary attachment(s) from figshare"
          git push -u origin "$BRANCH"

      - name: Open draft PR (best effort)
        if: |
          steps.diff.outputs.changed == 'true' &&
          steps.push.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
        run: |
          BRANCH="${{ steps.push.outputs.branch }}"
          COUNT="${{ steps.push.outputs.count }}"
          if gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "auto: backfill $COUNT missing primary attachment(s) from figshare (#280)" \
              --body-file /tmp/pr_body.md \
              --draft; then
            echo "::notice::Draft PR created."
          else
            URL="https://github.com/${{ github.repository }}/pull/new/$BRANCH"
            echo "::warning::Auto-PR blocked (likely repo setting). Branch pushed: $URL"
            {
              echo "Branch \`$BRANCH\` pushed with $COUNT new PDF(s) but auto-PR was blocked."
              echo "Open manually: $URL"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
