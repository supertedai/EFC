name: EFC repo verify

# Strict read-only verification that the EFC archive is self-consistent.
# Runs on PRs and on push-to-main. Does NOT auto-commit corrections —
# that's the job of .github/workflows/efc-sync.yml which runs on
# development branches only. If this workflow fails on a PR, the PR
# author should run `python3 scripts/maintenance/efc_maintain.py`
# locally, commit the result, and push — the sync workflow will keep
# them honest from that point on.

on:
  pull_request:
    paths:
      - "docs/papers/efc/**"
      - "docs/validation-ledger/**"
      - "docs/public/EFC_Validation_Ledger.html"
      - "docs/public/EFC_Changelog.html"
      - "docs/public/EFC_White_Paper_Series.html"
      - "scripts/maintenance/**"
      - "README.md"
      - ".github/workflows/efc-verify.yml"
  push:
    branches:
      - main
    paths:
      - "docs/papers/efc/**"
      - "docs/validation-ledger/**"
      - "docs/public/EFC_Validation_Ledger.html"
      - "docs/public/EFC_Changelog.html"
      - "docs/public/EFC_White_Paper_Series.html"
      - "scripts/maintenance/**"
      - "README.md"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Regenerate AI-friendly manifests
        run: python3 scripts/maintenance/efc_gen_ai_friendly.py
      - name: Check DOI sync consistency (C8)
        run: |
          python3 scripts/maintenance/efc_sync_dois.py --check
      - name: Run EFC verifier (C1–C8)
        run: python3 scripts/maintenance/efc_verify.py
      - name: Run drift detector
        run: |
          python3 scripts/maintenance/efc_drift_detector.py
          rc=$?
          if [ $rc -eq 2 ]; then
            echo "::warning::Drift detected in public pages. Run Claude Code session to auto-fix."
          fi
      - name: Fail on uncommitted changes
        run: |
          if ! git diff --quiet; then
            echo "::error::Maintenance scripts produced changes. Run 'python3 scripts/maintenance/efc_maintain.py' locally and commit the result."
            git --no-pager diff --stat | head -40
            exit 1
          fi
