name: EFC repo verify

# Triggers (measured 2026-09-06, t_0d65ccdf): this workflow had ONLY
# pull_request since c56f0007 (2026-04-28), which kept push-to-main out to
# avoid racing the auto-sync. Four merges to main and four efc-sync commits
# on 2026-09-06 therefore ran no verification on main at all — C1–C12 were
# measured in the PR window only. Now: pull_request AND push to main (same
# paths — a test keeps the two lists identical), a daily schedule (robot
# commits made with GITHUB_TOKEN never trigger workflows, so drift they
# introduce is caught within a day), and workflow_dispatch — efc-main-sync
# dispatches this right after each auto-commit; dispatch is the documented
# exception to the GITHUB_TOKEN rule.
#
# The race is real and expected, not hidden: a bare PDF upload makes the
# push run RED on "Fail on uncommitted changes" (that SHA is inconsistent)
# while efc-main-sync repairs the tree, and the dispatched run on the sync
# commit goes green a minute later. Read the newest run on main, not the
# first.
on:
  pull_request:
    paths:
      # C9 (efc: namespace) scans every JSON-LD document in the tree —
      # 186 of 506 live outside docs/papers/efc/ (meta/, methodology/,
      # schema/, jsonld/, api/, figshare/, docs/index.jsonld …), hence the
      # **/*.jsonld and **/*.json entries. Same list under push: below.
      - "docs/papers/efc/**"
      - "docs/validation-ledger/**"
      - "docs/public/EFC_Validation_Ledger.html"
      - "docs/public/EFC_Changelog.html"
      - "docs/public/EFC_White_Paper_Series.html"
      - "scripts/maintenance/**"
      - "README.md"
      - "**/*.jsonld"
      - "**/*.json"
      - "docs/ontology.*"
      - "tests/**"
      - ".github/workflows/efc-verify.yml"
  push:
    branches: [main]
    paths:
      - "docs/papers/efc/**"
      - "docs/validation-ledger/**"
      - "docs/public/EFC_Validation_Ledger.html"
      - "docs/public/EFC_Changelog.html"
      - "docs/public/EFC_White_Paper_Series.html"
      - "scripts/maintenance/**"
      - "README.md"
      - "**/*.jsonld"
      - "**/*.json"
      - "docs/ontology.*"
      - "tests/**"
      - ".github/workflows/efc-verify.yml"
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Regenerate AI-friendly manifests
        id: gen_ai_friendly
        run: python3 scripts/maintenance/efc_gen_ai_friendly.py
      - name: Check DOI sync consistency (C8)
        id: sync_dois_check
        run: python3 scripts/maintenance/efc_sync_dois.py --check
      - name: "Check the efc: namespace (C9 — one binding, every term declared, docs/ontology fresh)"
        run: python3 scripts/maintenance/efc_ontology.py
      - name: Check the concept registry (C11 — SKOS source, generated views fresh, dead copies absent, all concepts declared)
        run: python3 scripts/maintenance/efc_concepts.py
      - name: "Check schema identity and JSON-LD form (C12 — one $id authority, one dialect, @id on top, pointers resolve, codemeta 3.0)"
        run: python3 scripts/maintenance/efc_identity.py
      - name: Run EFC verifier (C1–C8)
        id: verify
        run: python3 scripts/maintenance/efc_verify.py
      - name: Run drift detector
        id: drift
        run: |
          set +e
          python3 scripts/maintenance/efc_drift_detector.py
          rc=$?
          if [ $rc -eq 2 ]; then
            echo "::warning::Drift detected in public pages. Run Claude Code session to auto-fix."
            exit 0
          fi
          exit $rc
      - name: Fail on uncommitted changes
        id: uncommitted_check
        run: |
          if ! git diff --quiet; then
            echo "::error::Maintenance scripts produced changes. Run 'python3 scripts/maintenance/efc_maintain.py' locally and commit the result."
            git --no-pager diff --stat | head -40
            exit 1
          fi
      - name: Diagnostic summary on failure
        if: failure()
        run: |
          echo "::group::Failed step attribution"
          echo "gen_ai_friendly:   ${{ steps.gen_ai_friendly.outcome }}"
          echo "sync_dois_check:   ${{ steps.sync_dois_check.outcome }}"
          echo "verify:            ${{ steps.verify.outcome }}"
          echo "drift:             ${{ steps.drift.outcome }}"
          echo "uncommitted_check: ${{ steps.uncommitted_check.outcome }}"
          echo "::endgroup::"
          echo "::group::Python + script versions"
          python3 --version
          for s in efc_gen_ai_friendly efc_sync_dois efc_verify efc_drift_detector; do
            echo "--- $s.py ---"
            python3 -c "import ast,sys; ast.parse(open('scripts/maintenance/$s.py').read()); print('syntax OK')" || echo "syntax FAIL"
          done
          echo "::endgroup::"
