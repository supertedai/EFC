name: EFC AI consistency audit

# GPT council: independent cross-check of all public-facing documents.
# Claude Code does the work; GPT validates the result.
#
# Triggers:
#   - Push to main when public pages change
#   - Manual dispatch (with optional model override)
#   - Weekly on Wednesday 06:30 UTC (catches slow drift)

on:
  push:
    branches: [main]
    paths:
      - "docs/public/**"
      - "README.md"
      - "AGENTS.md"
      - "pipelines/**/README.md"
  workflow_dispatch:
    inputs:
      model:
        description: "OpenAI model (default: gpt-5)"
        required: false
        default: "gpt-5"
  schedule:
    - cron: "30 6 * * 3"  # Wednesday 06:30 UTC — consistency audit
    - cron: "0 7 * * 1"   # Monday 07:00 UTC — weekly full scan

jobs:
  ai-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Run drift detector
        run: python3 scripts/maintenance/efc_drift_detector.py || true

      - name: Run unprocessed paper scan
        run: python3 scripts/maintenance/efc_unprocessed.py || true

      - name: Run weekly classification scan
        run: python3 scripts/maintenance/efc_weekly_scan.py || true

      - name: Scan for new external datasets
        run: python3 scripts/maintenance/efc_dataset_scanner.py || true

      - name: Run AI consistency audit (GPT council)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ inputs.model || 'gpt-5' }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::warning::OPENAI_API_KEY secret not set. Skipping AI audit."
            exit 0
          fi
          python3 scripts/maintenance/efc_ai_audit.py

      - name: Post audit to job summary
        if: always()
        run: |
          if [ -f docs/audit_report.md ]; then
            cat docs/audit_report.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: ai-audit-report
          path: docs/audit_report.md
