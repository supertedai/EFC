name: EFC AI consistency audit

# GPT council: independent cross-check of all public-facing documents.
# Claude Code does the work; GPT validates the result.
#
# Triggers:
#   - Push to main when public pages change
#   - Manual dispatch (with optional model override)
#   - Weekly on Wednesday 06:30 UTC (catches slow drift)

on:
  push:
    branches: [main]
    # NB: `paths` and `paths-ignore` cannot both be set for the same event —
    # GitHub rejects the workflow at startup (0s "workflow file issue"). Use a
    # negative glob inside `paths` to exclude the generated health page instead.
    paths:
      - "docs/public/**"
      - "!docs/public/EFC_System_Health.html"
      - "README.md"
      - "AGENTS.md"
      - "pipelines/**/README.md"
  workflow_dispatch:
    inputs:
      model:
        description: "OpenAI model (default: gpt-5-mini)"
        required: false
        default: "gpt-5-mini"
  schedule:
    - cron: "30 6 * * 3"  # Wednesday 06:30 UTC — consistency audit
    - cron: "0 7 * * 1"   # Monday 07:00 UTC — weekly full scan

jobs:
  ai-audit:
    # Self-hosted runner on Morten's Mac → the GPT-council runs on the LOCAL
    # LM Studio (EFC_LLM_PROVIDER=local below), no external API cost.
    runs-on: [self-hosted, lmstudio]
    steps:
      - uses: actions/checkout@v5

      # No actions/setup-python: on the self-hosted Mac runner it fails
      # (mkdir /Users/runner: Permission denied — it expects the cloud 'runner'
      # user). The maintenance scripts are pure stdlib, so the system python3
      # (/usr/bin/python3) runs them directly.

      - name: Run drift detector
        run: python3 scripts/maintenance/efc_drift_detector.py || true

      - name: Run unprocessed paper scan
        run: python3 scripts/maintenance/efc_unprocessed.py || true

      - name: Run weekly classification scan
        run: python3 scripts/maintenance/efc_weekly_scan.py || true

      - name: HARD GATE — empirical papers must be in Ledger
        run: python3 scripts/maintenance/efc_precommit_gate.py

      - name: Scan for new external datasets
        run: python3 scripts/maintenance/efc_dataset_scanner.py || true

      - name: Run AI consistency audit (local council @ LM Studio)
        env:
          # Local provider: efc_ai_audit.py hits the LM Studio OpenAI-compatible
          # endpoint via urllib (stdlib, no pip) — no external API, no key needed.
          EFC_LLM_PROVIDER: local
          LOCAL_OPENAI_BASE_URL: http://localhost:1234/v1
          LOCAL_MODEL: ${{ inputs.model || 'qwen/qwen3.6-27b' }}
          # Kept for the cloud fallback path only (unused when provider=local).
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ "$EFC_LLM_PROVIDER" != "local" ] && [ -z "$OPENAI_API_KEY" ]; then
            echo "::warning::No local provider and no OPENAI_API_KEY. Skipping AI audit."
            exit 0
          fi
          # Fail loudly if the local endpoint is unreachable (runner lost LM Studio).
          if [ "$EFC_LLM_PROVIDER" = "local" ]; then
            curl -sf -o /dev/null "$LOCAL_OPENAI_BASE_URL/models" \
              || { echo "::error::LM Studio not reachable at $LOCAL_OPENAI_BASE_URL"; exit 1; }
          fi
          python3 scripts/maintenance/efc_ai_audit.py

      - name: Post audit to job summary
        if: always()
        run: |
          if [ -f docs/audit_report.md ]; then
            cat docs/audit_report.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: ai-audit-report
          path: docs/audit_report.md
