name: EFC rootfile-consistency

# Verifies that Ledger version strings in README.md, AGENTS.md and
# llms.txt match the authoritative version published by
# docs/public/EFC_Validation_Ledger.html. The Ledger uses a dual-version
# scheme — "vX.Y (public HTML)" for the citation-facing version and
# "vA.B update" for the internal/data version — both of which are
# checked.
#
# This is a *non-blocking* warning gate. Pre-existing rootfile drift in
# the repo (e.g. README badge "v3.17" while Ledger publishes "v3.18")
# would block all PRs if this were a hard gate. Running it as a warning
# surfaces the drift in PR annotations without halting unrelated work.
# Once rootfiles are brought into sync the workflow can be promoted to
# a hard gate by removing the `continue-on-error: true` line below.
#
# Local equivalent:
#     python3 scripts/maintenance/efc_rootfile_consistency.py

on:
  pull_request:
    paths:
      - "README.md"
      - "AGENTS.md"
      - "llms.txt"
      - "docs/public/EFC_Validation_Ledger.html"
      - "scripts/maintenance/efc_rootfile_consistency.py"
      - ".github/workflows/efc-rootfile-consistency.yml"

jobs:
  rootfile-consistency:
    runs-on: ubuntu-latest
    continue-on-error: true  # warning-only until rootfiles are synced
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Run rootfile-consistency checker
        run: |
          set +e
          python3 scripts/maintenance/efc_rootfile_consistency.py
          rc=$?
          if [ $rc -eq 2 ]; then
            echo "::warning::Rootfile Ledger-version drift detected. See script output above. Fix per the line/version pairs reported."
            exit 0  # warning, not failure
          fi
          exit $rc
