name: EFC AI monitor

# Read-only AI observer of the EFC maintenance stack.
#
# Runs scripts/maintenance/efc_ai_monitor.py, which:
#   - Collects a state snapshot (ledger, paper archive, recent commits)
#   - Sends it to Claude (single API call, ~8k input / 2k output tokens)
#   - Writes docs/validation-ledger/ai_review.{json,md}
#   - Posts the markdown review to the GitHub Actions job summary
#
# Behaviour:
#   - Never modifies the ledger, paper archive, or public HTML
#   - Never auto-commits any file (uploads review as an artifact instead)
#   - Fails gracefully if ANTHROPIC_API_KEY is not configured (dry-run
#     stub + warning, exit 0 — does not block any other workflow)
#
# Triggers:
#   - Weekly on Monday 06:00 UTC (scheduled review)
#   - workflow_dispatch (on-demand)
#   - After a successful efc-sync run on a development branch
#     (observes the result without modifying it)

on:
  schedule:
    - cron: "0 6 * * 1"   # every Monday 06:00 UTC
  workflow_dispatch:
    inputs:
      model:
        description: "Local LM Studio model (default: qwen/qwen3.6-27b — non-reasoning, parses clean)"
        required: false
        default: "qwen/qwen3.6-27b"
  workflow_run:
    workflows: ["EFC auto-sync"]
    types: [completed]

concurrency:
  group: efc-ai-monitor
  cancel-in-progress: false

# Minimal permissions — read-only for code, write-only for artifacts.
permissions:
  contents: read
  actions: read

jobs:
  review:
    # Self-hosted Mac runner → local LM Studio (EFC_LLM_PROVIDER=local), no external API.
    runs-on: [self-hosted, lmstudio]
    # Skip the workflow_run path if the upstream sync failed
    if: >
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 50

      # No setup-python / no anthropic install: on the self-hosted Mac the system
      # python3 runs it, and local mode uses urllib (anthropic is imported lazily and
      # only on the non-local path). BL-1212.

      - name: Run EFC AI monitor (local council @ LM Studio)
        env:
          EFC_LLM_PROVIDER: local
          LOCAL_OPENAI_BASE_URL: http://localhost:1234/v1
          # qwen3.6-27b (non-reasoning): returns the JSON answer in `content` so the
          # monitor's parser structures it cleanly. gpt-oss-120b put its answer in the
          # `reasoning` field (thinking-out-loud) → empty structured fields. Small
          # snapshot prompt, so no need for 120B's big context. (BL-1212)
          LOCAL_MODEL: ${{ inputs.model || 'qwen/qwen3.6-27b' }}
        run: |
          set -o pipefail
          curl -sf -o /dev/null "$LOCAL_OPENAI_BASE_URL/models" \
            || { echo "::error::LM Studio not reachable at $LOCAL_OPENAI_BASE_URL"; exit 1; }
          python3 scripts/maintenance/efc_ai_monitor.py \
              --model "$LOCAL_MODEL" \
              --out ai_review_out 2>&1 | tee monitor.log

      - name: Post review to job summary
        if: always()
        run: |
          {
            echo "# EFC AI Monitor"
            echo
            if [ -f ai_review_out/ai_review.md ]; then
              cat ai_review_out/ai_review.md
            else
              echo "_No review produced._"
            fi
            echo
            echo "---"
            echo
            echo "## Monitor log (tail)"
            echo
            echo '```'
            tail -40 monitor.log 2>/dev/null || echo "(no log)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload review as artifact
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: efc-ai-review-${{ github.run_id }}
          path: |
            ai_review_out/ai_review.json
            ai_review_out/ai_review.md
            monitor.log
          if-no-files-found: warn
          retention-days: 30

      - name: Surface the health signal
        if: always()
        run: |
          if [ -f ai_review_out/ai_review.json ]; then
            HEALTH=$(python3 -c '
          import json, sys
          with open("ai_review_out/ai_review.json") as f:
              d = json.load(f)
          print(d.get("review", {}).get("overall_health", "unknown"))
          ')
            echo "Overall health: $HEALTH"
            echo "health=$HEALTH" >> "$GITHUB_OUTPUT"
          fi
