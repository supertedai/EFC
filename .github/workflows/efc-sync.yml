name: EFC auto-sync

# Keep the EFC archive self-consistent on every push to any development
# branch. Runs the full maintenance pass (generator → DOI sync →
# generator → verifier), and if the sync produced any drift corrections,
# auto-commits them back to the same branch so the human never has to
# run the maintenance scripts manually after editing a DOI.
#
# Only runs on branches, not on main — main is protected and its
# contents are only changed via merged PRs.
#
# Manual trigger is also available via workflow_dispatch, and a nightly
# schedule catches any drift that slipped in via direct web edits.

on:
  push:
    branches-ignore:
      - main
    # Denylist instead of allowlist: the whole repo is the sync surface,
    # so anything that ISN'T a generated artefact or bot-written file
    # should trigger a maintenance pass. Paths listed here are excluded
    # to avoid feedback loops (bot writes file → workflow triggers →
    # bot writes file again …) and pure noise.
    paths-ignore:
      # Workflow log tee'd by the maintenance job itself
      - "maintain.log"
      # .claude/ artefacts regenerated by maintenance scripts
      - ".claude/symbiose_snapshot.json"
      - ".claude/drift_report.json"
      - ".claude/dataset_scan_report.json"
      - ".claude/unprocessed_papers.json"
      # docs/ generator outputs
      - "docs/council_log.json"
      - "docs/weekly_scan_report.json"
      - "docs/audit_report.md"
      # figshare/ generator outputs
      - "figshare/sync_log.json"
      - "figshare/auth.json"
      # reproduce_*.py JSON outputs (regenerated when scripts run)
      - "reproduce_*_output.json"
      # Cobaya MCMC chains / results
      - "tools/cobaya_bridge/chains/**"
      - "tools/cobaya_bridge/results/**"
      # Python / editor cruft
      - "**/__pycache__/**"
      - "**/*.pyc"
      - "**/.DS_Store"
      - ".gitignore"
  workflow_dispatch:
  schedule:
    # Nightly at 05:30 UTC — catches drift from direct web edits
    - cron: "30 5 * * *"

concurrency:
  group: efc-sync-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    # Skip on forks (GITHUB_TOKEN can't push to the parent repo).
    # Also skip when the push was made by the sync bot itself — belt-and-
    # braces guard against feedback loops in case a regenerated file
    # slips past paths-ignore above.
    if: >-
      github.actor != 'efc-sync[bot]' &&
      (github.event.pull_request.head.repo.full_name == github.repository ||
       github.event_name != 'pull_request')
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install poppler-utils (for PDF text extraction)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
          which pdftotext && pdftotext -v 2>&1 | head -1 || echo "WARNING: pdftotext not found after install"

      - name: Record baseline commit
        id: baseline
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Run EFC maintenance pass
        id: maintain
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-5
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: claude-opus-4-6
        run: |
          set -o pipefail
          python3 scripts/maintenance/efc_maintain.py 2>&1 | tee maintain.log
          echo "rc=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
        continue-on-error: true

      - name: Diagnose conflicts (if any)
        if: steps.maintain.outputs.rc != '0'
        run: |
          echo "::warning::Maintenance pass reported conflicts — inspecting"
          python3 scripts/maintenance/efc_sync_dois.py --report || true

      - name: Detect drift corrections
        id: diff
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No drift — branch already consistent."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Drift detected — will auto-commit corrections."
            git --no-pager diff --stat
          fi

      - name: Commit & push drift corrections
        if: steps.diff.outputs.changed == 'true' && github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "efc-sync[bot]"
          git config user.email "efc-sync[bot]@users.noreply.github.com"
          git add -A

          # Build a structured commit message listing what changed
          {
            echo "chore(efc-sync): auto-propagate DOIs and refresh manifests"
            echo
            echo "Generated by scripts/maintenance/efc_maintain.py running under"
            echo ".github/workflows/efc-sync.yml on commit ${{ steps.baseline.outputs.sha }}."
            echo
            echo "Pipeline: efc_gen_ai_friendly -> efc_sync_dois --apply ->"
            echo "          efc_gen_ai_friendly -> efc_verify"
            echo
            echo "Files touched:"
            git diff --cached --name-only | sed 's/^/  - /'
            echo
            echo "Run log excerpt:"
            tail -40 maintain.log | sed 's/^/  /'
          } > /tmp/commit_msg

          git commit -F /tmp/commit_msg

          # Retry with exponential backoff — pull --rebase if remote diverged
          for delay in 2 4 8 16; do
            if git push origin HEAD:"${GITHUB_REF_NAME:-${{ github.ref_name }}}"; then
              echo "Push succeeded."
              break
            fi
            echo "Push failed; pulling --rebase and retrying in ${delay}s"
            git pull --rebase origin "${GITHUB_REF_NAME:-${{ github.ref_name }}}" || true
            sleep "$delay"
          done

      - name: Notify Symbiose QA webhook
        if: steps.diff.outputs.changed == 'true'
        run: |
          # Trigger Symbiose quality assurance cross-check
          # Symbiose independently verifies ledger data against Neo4j/Qdrant
          if [ -n "$SYMBIOSE_WEBHOOK_URL" ]; then
            curl -s -X POST "$SYMBIOSE_WEBHOOK_URL" \
              -H "Content-Type: application/json" \
              -d "{\"event\":\"efc_push\",\"commit\":\"$(git rev-parse HEAD)\",\"papers\":$(python3 -c 'import os; print(sum(1 for d in os.listdir(\"docs/papers/efc\") if os.path.isdir(os.path.join(\"docs/papers/efc\",d)) and d not in {\"README.md\"}))')}" \
              --max-time 10 || echo "Symbiose webhook not reachable — QA will run on next cron cycle"
          else
            echo "SYMBIOSE_WEBHOOK_URL not set — Symbiose QA runs via cron"
          fi
        env:
          SYMBIOSE_WEBHOOK_URL: ${{ secrets.SYMBIOSE_WEBHOOK_URL }}
        continue-on-error: true

      - name: Job summary
        if: always()
        run: |
          {
            echo "## EFC auto-sync summary"
            echo
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Branch | \`${GITHUB_REF_NAME:-${{ github.ref_name }}}\` |"
            echo "| Baseline commit | \`${{ steps.baseline.outputs.sha }}\` |"
            echo "| Maintain rc | \`${{ steps.maintain.outputs.rc }}\` |"
            echo "| Drift corrections | \`${{ steps.diff.outputs.changed }}\` |"
            echo
            if [ -f maintain.log ]; then
              echo "### Maintenance log"
              echo '```'
              tail -80 maintain.log
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload maintenance log
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: efc-maintain-log-${{ github.run_id }}
          path: maintain.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Fail if maintenance did not converge
        if: steps.maintain.outputs.rc != '0'
        run: |
          echo "::error::efc_maintain.py returned non-zero — see job summary and logs"
          exit 1
