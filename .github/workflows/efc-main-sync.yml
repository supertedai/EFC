name: EFC main auto-sync

# Auto-fix maintenance issues on main when papers are uploaded directly
# or when any maintenance input changes. Generates missing metadata
# (index.json, CITATION.cff, etc.) from bare PDFs, fixes paper count
# drift between data files and public HTML, and propagates DOIs.
#
# This is the "everything automatic" workflow — covers the gap where
# efc-sync.yml only runs on dev branches. The path filter is kept in
# sync with efc-verify.yml so that every input the maintenance pipeline
# reconciles triggers a sync on main.

on:
  push:
    branches: [main]
    paths:
      - "docs/papers/efc/**"
      - "docs/validation-ledger/**"
      - "docs/public/EFC_Validation_Ledger.html"
      - "docs/public/EFC_Changelog.html"
      - "docs/public/EFC_White_Paper_Series.html"
      - "scripts/maintenance/**"
      - "README.md"
      - ".github/workflows/efc-main-sync.yml"
  workflow_dispatch:

concurrency:
  group: efc-main-sync
  cancel-in-progress: true

permissions:
  contents: write
  actions: write   # gh workflow run efc-verify.yml / efc-schema.yml right after an auto-commit

jobs:
  auto-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install poppler-utils (for PDF text extraction)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
          which pdftotext && pdftotext -v 2>&1 | head -1 || echo "WARNING: pdftotext not found after install"

      # LLM-noeklene sendes IKKE lenger inn her, og det er grunnen til at
      # denne workflowen kan staa PAA igjen.
      #
      # Den ble slaatt av manuelt — ikke fordi den feilet (siste kjoering
      # 2026-07-26 var vellykket), men fordi steget «AI Brain» kaller gpt-5 og
      # claude-opus paa hver eneste push til main som roerer papers, ledger
      # eller scripts. Samme kostnadsgrunn som #332 og #334.
      #
      # Konsekvensen av at den sto av: docs/papers — 3 036 filer, tre
      # fjerdedeler av repoet — hadde en eier paa papiret som ikke hadde
      # kjoert siden 26. juli. Det er en dyrere tilstand enn LLM-regninga.
      #
      # Uten noeklene hopper efc_ai_brain.py av seg selv («LLM providers:
      # NONE», exit 0 — verifisert), og resten av pipelinen kjoerer
      # deterministisk: auto-metadata, gen-ai-friendly, DOI-sync, navbar-sync,
      # drift-detector, rootfile-consistency, cross-validate, auto-changelog.
      #
      # Skal beriking med LLM tilbake, hoerer den hjemme som en EGEN, sjeldnere
      # workflow — ikke som et steg som fyrer paa hver push.
      - name: Run maintenance pipeline (deterministisk — uten AI Brain)
        run: |
          python3 scripts/maintenance/efc_maintain.py 2>&1 | tee maintain.log
        continue-on-error: true

      # PORTEN. efc_cross_validate sier selv at den «blocks publishing if
      # critical discrepancies are found», og exit 1 betyr «blocks publish».
      # Auto-commit var likevel bare betinget av at NOE hadde endret seg:
      # maintenance-steget har continue-on-error, saa et BLOCK gikk rett
      # gjennom og skrev til main uansett.
      #
      # Maalt 2026-08-24: porten sier BLOCK i dag («bao_desi_y1: still LCDM
      # stub»). Uten denne endringen ville en paaskrudd workflow committet
      # over den dommen.
      #
      # Exit: 0 = rent, 1 = kritisk (blokker), 2 = bare advarsler. Bare 1 stopper.
      - name: Kryssvalidering — porten foer auto-commit
        id: gate
        run: |
          set +e
          python3 scripts/maintenance/efc_cross_validate.py
          rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          if [ "$rc" = "1" ]; then
            echo "::error::Kryssvalidering sier BLOCK — auto-commit hoppes over."
          fi
          exit 0

      - name: Porten foer auto-commit (C8, C9, C11, C12, C1–C8, drift)
        id: porten
        # The maintenance pass above may itself be what repairs a red tree
        # (a bare PDF upload gets its package here), so the gate runs AFTER
        # it and BEFORE the commit: a red result keeps main as it is — drift
        # visible in this run's log — instead of landing a red commit that
        # no workflow would ever verify (GITHUB_TOKEN commits trigger none).
        run: |
          set +e
          rc=0
          python3 scripts/maintenance/efc_sync_dois.py --check || rc=1
          python3 scripts/maintenance/efc_ontology.py || rc=1
          python3 scripts/maintenance/efc_concepts.py || rc=1
          python3 scripts/maintenance/efc_identity.py || rc=1
          python3 scripts/maintenance/efc_verify.py || rc=1
          python3 scripts/maintenance/efc_drift_detector.py
          drc=$?
          if [ "$drc" = "2" ]; then
            echo "::warning::Drift detected in public pages (rc=2) — not blocking; efc_maintain ran --fix above."
          elif [ "$drc" != "0" ]; then
            rc=1
          fi
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          if [ "$rc" = "1" ]; then
            echo "::error::Porten er roed etter vedlikeholdspasset — auto-commit hoppes over og kjoeringen er ROED. Se stegets logg; treet paa main er uendret."
            exit 1
          fi
      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes — main is already consistent."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Changes detected — will auto-commit."
            git --no-pager diff --stat
            git ls-files --others --exclude-standard
          fi

      - name: Auto-commit fixes to main
        if: steps.diff.outputs.changed == 'true' && steps.gate.outputs.rc != '1' && steps.porten.outputs.rc == '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "efc-sync[bot]"
          git config user.email "efc-sync[bot]@users.noreply.github.com"
          git add -A

          {
            echo "chore(efc-sync): auto-generate metadata and fix drift on main"
            echo
            echo "Triggered by push to main. Pipeline:"
            echo "  efc_auto_metadata → efc_gen_ai_friendly → efc_sync_dois →"
            echo "  efc_verify → efc_drift_detector --fix"
            echo
            echo "Files touched:"
            git diff --cached --name-only | sed 's/^/  - /'
          } > /tmp/commit_msg

          git commit -F /tmp/commit_msg

          pushed=0
          for delay in 2 4 8 16; do
            if git push; then
              echo "Push succeeded."
              pushed=1
              break
            fi
            echo "Push failed; pulling --rebase and retrying in ${delay}s"
            git pull --rebase origin main || true
            sleep "$delay"
          done
          if [ "$pushed" != "1" ]; then
            echo "::error::Push failed four times — nothing landed."
            exit 1
          fi
          # A commit pushed with GITHUB_TOKEN triggers no workflow — except
          # workflow_dispatch and repository_dispatch — so verification of
          # the sync commit is dispatched here, in the same step, right
          # after the push: no window for a cancel-in-progress to leave a
          # landed commit unverified. Pages needs no dispatch: the legacy
          # builder builds on every push, robot pushes included (measured).
          gh workflow run efc-verify.yml --ref main
          gh workflow run efc-schema.yml --ref main

      - name: Job summary
        if: always()
        run: |
          {
            echo "## EFC main auto-sync"
            echo
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Changes | \`${{ steps.diff.outputs.changed }}\` |"
            echo "| Kryssvalidering rc | \`${{ steps.gate.outputs.rc }}\` |"
            echo "| Porten rc | \`${{ steps.porten.outputs.rc }}\` |"
            echo
            if [ -f maintain.log ]; then
              echo '```'
              tail -30 maintain.log
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
