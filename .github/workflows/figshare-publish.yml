name: Publish EFC E_G pre-registration to Figshare

on:
  push:
    branches:
      - claude/figshare-publishing-76Xdi
      - main
    paths:
      - 'figshare/preregistration-eg-so-euclid-2026-04-15/**'
      - 'scripts/figshare/upload_preregistration.py'
      - '.github/workflows/figshare-publish.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: figshare-publish-eg-2026-04-15
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check publication status
        id: check
        run: |
          set -e
          META='figshare/preregistration-eg-so-euclid-2026-04-15/metadata.json'
          DOI=$(python3 -c "import json; print(json.load(open('$META')).get('doi') or '')")
          if [ -n "$DOI" ]; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Pre-registration already published with DOI $DOI — skipping."
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install TeX Live
        if: steps.check.outputs.already_published == 'false'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base texlive-latex-extra texlive-latex-recommended \
            texlive-fonts-recommended texlive-fonts-extra latexmk

      - name: Build PDF
        if: steps.check.outputs.already_published == 'false'
        working-directory: figshare/preregistration-eg-so-euclid-2026-04-15
        run: |
          latexmk -pdf -interaction=nonstopmode -halt-on-error paper.tex
          ls -lh paper.pdf

      - name: Set up Python
        if: steps.check.outputs.already_published == 'false'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        if: steps.check.outputs.already_published == 'false'
        run: pip install requests

      - name: Upload to Figshare
        if: steps.check.outputs.already_published == 'false'
        env:
          FIGSHARE_TOKEN: ${{ secrets.API_FIGSHARE_EFC }}
        run: python3 scripts/figshare/upload_preregistration.py

      - name: Commit DOI metadata back to branch
        if: steps.check.outputs.already_published == 'false'
        run: |
          set -e
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add figshare/preregistration-eg-so-euclid-2026-04-15/metadata.json \
                  figshare/doi-map.json
          if git diff --cached --quiet; then
            echo "No metadata changes to commit."
          else
            git commit -m "chore(figshare): record DOI for E_G SO×Euclid pre-registration

Auto-committed by figshare-publish workflow after successful upload."
            git push origin HEAD:${GITHUB_REF_NAME}
          fi

      - name: Upload PDF artifact
        if: steps.check.outputs.already_published == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: preregistration-eg-so-euclid-pdf
          path: figshare/preregistration-eg-so-euclid-2026-04-15/paper.pdf
          retention-days: 90
