name: efc-schema

# C10 — registered JSON Schema / instance pairs are valid and CLOSED.
# Measured 2026-09-05: 16 workflows, none ran a schema validator; 0 of ~400
# schemas closed. The registry lives in scripts/maintenance/efc_schema_check.py.

on:
  push:
    branches: [main]
    paths:
      - "docs/likelihood-ledger/**"
      - "docs/evaluation-ledger/schema.json"
      - "docs/model-comparison/schema.json"
      - "schema/framework_atlas.*"
      - "schema/regime_node.schema.json"
      - "schema/regime_nodes.jsonld"
      - "scripts/maintenance/efc_schema_check.py"
      - "scripts/maintenance/efc_atlas_export.py"
      - "scripts/maintenance/efc_bro_synk.py"
      - "scripts/maintenance/efc_bro_konvensjon.py"
      - "scripts/maintenance/bygg_kildenoder.py"
      - "tests/test_efc_schema_check.py"
      - "tests/test_workflows_parse.py"
      - "tests/test_regime_node_schema.py"
      - "tests/test_usikkerhetslag.py"
      - "scripts/atlas_lesing.py"
      - "scripts/atlas_kilder.py"
      - "schema/atlas_dekning.json"
      - "tests/test_atlas_kilder.py"
      - "tests/test_efc_provenance.py"
      - "tests/test_bro_konvensjon.py"
      - "tests/test_holding_release_motorer.py"
      - "docs/efc-atlas/eksperiment/**"
      - ".github/workflows/*.yml"
      - "requirements.txt"
      - "Makefile"
      - ".github/workflows/efc-schema.yml"
  pull_request:
    paths:
      - "docs/likelihood-ledger/**"
      - "docs/evaluation-ledger/schema.json"
      - "docs/model-comparison/schema.json"
      - "schema/framework_atlas.*"
      - "schema/regime_node.schema.json"
      - "schema/regime_nodes.jsonld"
      - "scripts/maintenance/efc_schema_check.py"
      - "scripts/maintenance/efc_atlas_export.py"
      - "scripts/maintenance/efc_bro_synk.py"
      - "scripts/maintenance/efc_bro_konvensjon.py"
      - "scripts/maintenance/bygg_kildenoder.py"
      - "tests/test_efc_schema_check.py"
      - "tests/test_workflows_parse.py"
      - "tests/test_regime_node_schema.py"
      - "tests/test_usikkerhetslag.py"
      - "scripts/atlas_lesing.py"
      - "scripts/atlas_kilder.py"
      - "schema/atlas_dekning.json"
      - "tests/test_atlas_kilder.py"
      - "tests/test_efc_provenance.py"
      - "tests/test_bro_konvensjon.py"
      - "tests/test_holding_release_motorer.py"
      - "docs/efc-atlas/eksperiment/**"
      - ".github/workflows/*.yml"
      - "requirements.txt"
      - "Makefile"
      - ".github/workflows/efc-schema.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # The sealed atlas experiment (docs/efc-atlas/eksperiment) reads its
          # OWN bank snapshot — a commit, not a ref (see that directory's
          # bank.py). A shallow clone cannot see it, and the reproduction would
          # fail for the wrong reason.
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install validator and test runner (pinned ranges, same as requirements.txt)
        run: python3 -m pip install --quiet "jsonschema>=4.18,<5" "rfc3339-validator>=0.1,<1" "pytest>=8,<9" "PyYAML>=6,<7" "emcee>=3,<4" "numpy>=1.22,<3" "scipy>=1.8,<2"

      - name: C10 — registered schema/instance pairs valid and closed
        run: python3 scripts/maintenance/efc_schema_check.py

      - name: Motor↔atlas-broen — fila i deklarert format, ingen avvik
        run: python3 scripts/maintenance/efc_bro_synk.py --sjekk

      - name: Unit tests for the gate, and every workflow file parses
        run: python3 -m pytest tests/test_efc_schema_check.py tests/test_workflows_parse.py tests/test_regime_node_schema.py tests/test_usikkerhetslag.py tests/test_repo_konfigurasjon.py tests/test_efc_provenance.py tests/test_bro_konvensjon.py tests/test_holding_release_motorer.py tests/test_atlas_kilder.py -q

      # The bank is this job's subject, so the sealed experiment belongs here:
      # it goes red when the atlas moves away from the bank its key was written
      # against. Measured 2026-09-19: 4 of 12 tests failed on main because the
      # readers read `origin/main` at run time and nothing ran the path at all.
      - name: The sealed atlas experiment reproduces, and its drift is named
        run: python3 -m pytest docs/efc-atlas/eksperiment -q
